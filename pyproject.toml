[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asthma-early-warning"
version = "0.1.0"
description = "Three-panel asthma risk API: breath, air, screen"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "torchaudio",
    "scikit-learn",
    "requests",
    "pandas",
    "numpy",
    "tqdm",
    "pillow",
    "fastapi",
    "uvicorn",
    "pydantic",
    "python-multipart",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "black==26.10.1",
    "ruff==0.17.3",
    "mypy==2.4.1",
]
screen = [
    "torchvision",
    "timm",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["data*", "model*", "air*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]

[tool.ruff.lint.isort]
known-first-party = ["data", "model", "air", "scripts", "desktop", "screen", "predict", "report", "train", "api"]

[tool.ruff.lint]
# B008 conflicts with fastapi dependency-injection defaults (File(...), Form(...))
extend-ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
explicit_package_bases = true
mypy_path = "."
exclude = ["dist/", "build/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["data", "model", "air", "scripts"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]