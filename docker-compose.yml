version: "3.8"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - ASTHMA_SCREEN_ENABLED=false
      - OPENAQ_KEY=${OPENAQ_KEY:-}
    volumes:
      - ./checkpoints:/app/checkpoints
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Redis for caching (future use)
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"